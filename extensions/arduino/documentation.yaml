icon: logos:arduino
markdownTemplate: |2

  # Arduino Extension for NetLogo

  This extension provides 'no-frills' communication between NetLogo and a connected Arduino.

  {{> BUILDING.md}}

  {{> USING.md}}

  ## Primitives

  {{#contents}}{{#prims}}
